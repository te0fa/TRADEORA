name: cockroach-sync

on:
  schedule:
    # كل يوم الساعة 8 مساءً بتوقيت القاهرة (6 PM UTC)
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'full'
        type: choice
        options: ['check', 'schema', 'data', 'full']
      days:
        description: 'Days back for data sync'
        required: false
        default: '90'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase psycopg2-binary python-dotenv

      - name: Run sync (scheduled = full)
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL:              ${{ secrets.COCKROACHDB_URL }}
        run: python cockroach_sync.py --full --days 90

      - name: Run sync (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL:              ${{ secrets.COCKROACHDB_URL }}
        run: python cockroach_sync.py --${{ github.event.inputs.mode }} --days ${{ github.event.inputs.days || '90' }}
