name: Intraday Signal Scanner

on:
  schedule:
    # Runs every 15 minutes from 07:00 UTC to 12:30 UTC (10:00 AM -> 3:30 PM Cairo time) Sun-Thu
    - cron: '*/15 7-12 * * 0-4'
  workflow_dispatch:

jobs:
  scan-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Lightweight core - no vectorbt/quantstats/selenium/playwright
        pip install \
          supabase \
          python-dotenv \
          requests \
          beautifulsoup4 \
          pytz \
          pandas \
          numpy \
          joblib \
          scikit-learn \
          xgboost \
          pandas-ta-classic

    - name: Run Real-time Intraday News & EGX Disclosures Scrapers
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python scrapers/egx_disclosures_insider_scraper.py || true
        python scrapers/almal_news_scraper.py || true

    - name: Run Intraday Signal Scanner
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python generate_intraday_recommendations.py
