name: Intraday Signal Scanner

on:
  schedule:
    # Runs every 15 minutes from 07:00 UTC to 11:30 UTC (10:00 AM -> 02:30 PM Cairo time) Sun-Thu
    - cron: '*/15 7-11 * * 0-4'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  scan-intraday:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Real-time Intraday News & EGX Disclosures Scrapers
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python scrapers/egx_disclosures_insider_scraper.py || true
        python scrapers/almal_news_scraper.py || true

    - name: Run Intraday Signal Scanner
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python generate_intraday_recommendations.py
