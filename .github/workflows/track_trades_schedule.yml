name: Tradeora Real-time Active Trades Tracking (LEGACY - DISABLED)
# ⚠️ DISABLED: Replaced by trade-monitor.yml which is more reliable and efficient
# Kept for reference only - do not re-enable

on:
  # DISABLED - use trade-monitor.yml instead
  workflow_dispatch:

concurrency:
  group: trade-tracking
  cancel-in-progress: true

jobs:
  track-trades:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Active Trades Monitor Script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://tradeora-web.vercel.app' }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python track_trades.py
