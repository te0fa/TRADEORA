name: Intraday EGX Price Ingestion & Consensus

on:
  schedule:
    # Runs every 15 minutes between 10:00 AM and 3:30 PM Cairo Time (7:00 AM to 12:30 PM UTC) Sunday to Thursday
    - cron: '*/15 7-12 * * 0-4'
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Type of run: full, light, or dynamic'
        required: false
        default: 'dynamic'

concurrency:
  group: intraday-ingestion
  cancel-in-progress: true

jobs:
  ingest-intraday-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies (lightweight)
      run: |
        python -m pip install --upgrade pip
        pip install \
          supabase \
          python-dotenv \
          requests \
          pytz \
          yfinance

    - name: Run Intraday Consensus Importer
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python services/intraday_importer.py --run-type ${{ github.event.inputs.run_type || 'dynamic' }}

    - name: Prune Old Intraday Snapshots (Older than 90 days)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
      run: |
        python -c "
        import os, time
        from supabase import create_client
        from datetime import datetime, timezone, timedelta
        url = os.environ.get('SUPABASE_URL') or os.environ.get('NEXT_PUBLIC_SUPABASE_URL', '')
        key = os.environ.get('SUPABASE_SERVICE_ROLE_KEY') or os.environ.get('SUPABASE_KEY', '')
        sb = create_client(url, key)
        cutoff = (datetime.now(timezone.utc) - timedelta(days=90)).isoformat()
        print('Pruning snapshot times before:', cutoff)
        res_comp = sb.table('companies').select('id').execute()
        companies = res_comp.data if res_comp.data else []
        total_deleted = 0
        for co in companies:
            cid = co['id']
            del_res = sb.table('intraday_snapshots').delete().eq('company_id', cid).lt('snapshot_time', cutoff).execute()
            deleted = len(del_res.data) if del_res.data else 0
            total_deleted += deleted
            if deleted > 0:
                time.sleep(0.05)
        print(f'Pruning job completed successfully. Total deleted: {total_deleted}')
        "
